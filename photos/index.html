<script>
(function(){
  var b=document.querySelector('.theme-toggle');
  function cur(){return document.documentElement.getAttribute('data-theme')==='dark'?'dark':'light';}
  function sync(){var d=cur()==='dark';b.classList.toggle('is-dark',d);b.setAttribute('aria-label',d?'Switch to light theme':'Switch to dark theme');}
  b.addEventListener('click',function(){var n=cur()==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);try{localStorage.setItem('theme',n);}catch(e){}sync();});
  sync();
  var links=[].slice.call(document.querySelectorAll('.pcard a')),lb=document.querySelector('.lb'),im=lb.querySelector('img'),cap=lb.querySelector('p'),i=0;
  function show(k){i=(k+links.length)%links.length;im.src=links[i].href;im.alt=links[i].dataset.cap;cap.textContent=links[i].dataset.cap;lb.classList.add('open');}
  links.forEach(function(a,k){a.addEventListener('click',function(e){e.preventDefault();show(k);});});
  lb.querySelector('.x').onclick=function(){lb.classList.remove('open');};
  lb.querySelector('.prev').onclick=function(){show(i-1);};
  lb.querySelector('.next').onclick=function(){show(i+1);};
  lb.addEventListener('click',function(e){if(e.target===lb)lb.classList.remove('open');});
  document.addEventListener('keydown',function(e){if(!lb.classList.contains('open'))return;if(e.key==='Escape')lb.classList.remove('open');if(e.key==='ArrowLeft')show(i-1);if(e.key==='ArrowRight')show(i+1);});
})();
</script>
